<!doctype html>
<html>
	<head>
		<meta name="description" content="All-Purpose-Application-Framework Micro-Service Explorer Page">
		<meta name="Author" lang="fr" content="Nicolas Renaudet">
		<meta name="Copyright" content="2025 Nicolas Renaudet - All rights reserved">
		<meta charset="ISO-8859-1">
		<meta http-equiv="Content-Type" content="text/html; ISO-8859-1">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Content-Style-Type" content="text/css">
		<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	    <meta name='viewport' content='width=device-width, initial-scale=1'>
		<link rel="icon" type="image/png" href="/apaf-branding/img/apaf-logo.png?version=1.0"/>
		<link href="/css/bootstrap.min.css" rel="stylesheet">
		<link href="/resources/css/apaf.css" rel="stylesheet">
		<link href="/apaf-micro-service-explorer/css/microServiceExplorer.css" rel="stylesheet">
		<title>All Purpose Application Framework</title>
	</head>
	<body>
		<div id="navBar" class="npaUi" data-ref="menu"></div>
		<div id="card" class="npaUi" data-config="/apaf-micro-service-explorer/json/microServiceExplorerCardConfig.json">
			<div class="row" style="margin-top: 5px;">

				<!-- Left column: list + remote controls -->
				<div class="col-4 d-flex flex-column" id="msLeftCol">
					<div id="remoteStatusBar" class="mse-remote-status-bar" style="display:none;">
						<img src="/uiTools/img/silk/world_go.png">&nbsp;<span id="remoteStatusLabel"></span>
						<button id="clearRemoteBtn" type="button" class="btn btn-sm btn-outline-light float-end" style="padding: 0 6px; line-height: 1.4;"></button>
					</div>
					<div class="mse-list-toolbar">
						<button id="remoteBtn" type="button" class="btn btn-sm btn-outline-secondary"></button>
						<button id="refreshBtn" type="button" class="btn btn-sm btn-outline-secondary float-end">
							<img src="/uiTools/img/silk/arrow_refresh.png">
						</button>
					</div>
					<div id="msList" class="mse-list" style="flex:1; overflow-y:auto;"></div>
				</div>

				<!-- Right column: service detail + test panel -->
				<div id="msDetailArea" class="col-8" style="overflow-y:auto;">
					<div id="msDetailPlaceholder" class="mse-detail-placeholder">
						<img src="/uiTools/img/silk/cog.png">&nbsp;
						<span id="selectHint"></span>
					</div>
					<div id="msDetailContent" style="display:none;">

						<!-- Header: method badge + name + version -->
						<div id="msDetailHeader" class="mse-detail-header"></div>

						<!-- Description -->
						<div id="msDetailDescription" class="mse-detail-description"></div>

						<!-- Security role -->
						<div class="mse-detail-section-label" id="msSecurityLabel"></div>

						<!-- Invocation URL -->
						<div class="mse-detail-section-label" id="msUriLabel" style="margin-top:6px;"></div>

						<!-- API descriptor (OpenAPI-style) -->
						<div id="msApiDocSection" style="display:none;">
							<div class="mse-detail-section-label" id="msApiDocLabel" style="margin-top:6px;"></div>
							<div id="msApiDocContent" class="mse-apidoc-panel"></div>
						</div>

						<!-- Test panel -->
						<div class="mse-detail-test-panel">
							<div class="row align-items-center" style="margin-bottom: 6px;">
								<div class="col-2 form-row-label" id="labelUri"></div>
								<div class="col-8"><input id="testUri" type="text" class="form-control form-control-sm"></div>
								<div class="col-2"><button id="testBtn" type="button" class="btn btn-sm btn-primary"></button></div>
							</div>
							<div class="row" id="payloadRow" style="display:none; margin-bottom: 6px;">
								<div class="col-2 form-row-label" id="labelPayload"></div>
								<div class="col-10"><textarea id="payload" class="form-control form-control-sm mse-payload-area" rows="5"></textarea></div>
							</div>
							<div class="row">
								<div class="col-2 form-row-label">
									<span id="labelResult"></span>&nbsp;<button id="copyResultBtn" type="button" class="btn btn-sm btn-outline-secondary" style="padding: 1px 4px; line-height: 1;">
										<img src="/uiTools/img/silk/page_white_copy.png" style="vertical-align: middle;">
									</button>
								</div>
								<div class="col-10 mse-result-col">
									<div id="testResultArea" class="mse-result-area">
										<div id="testResult" class="mse-result-content"></div>
									</div>
								</div>
							</div>
						</div>

					</div><!-- /msDetailContent -->
				</div><!-- /msDetailArea -->
			</div>
		</div>

		<!-- Remote context modal -->
		<div id="remoteContextModal" class="mse-modal-overlay" style="display:none;">
			<div class="mse-modal-box">
				<div class="mse-modal-header">
					<span id="remoteModalTitle"></span>
					<button type="button" class="btn-close float-end" id="remoteModalCloseBtn"></button>
				</div>
				<div class="mse-modal-body">
					<ul class="nav nav-tabs mb-3" id="remoteTabs">
						<li class="nav-item">
							<button class="nav-link active" id="tabManual" type="button" data-remote-tab="manual"></button>
						</li>
						<li class="nav-item">
							<button class="nav-link" id="tabLink" type="button" data-remote-tab="link"></button>
						</li>
					</ul>
					<!-- Manual tab -->
					<div id="remoteTabManual">
						<div class="row mb-2">
							<label class="col-3 col-form-label col-form-label-sm" id="remoteModalHostLabel"></label>
							<div class="col-6"><input type="text" id="remoteHost" class="form-control form-control-sm" placeholder="192.168.1.10"></div>
							<div class="col-3"><input type="number" id="remotePort" class="form-control form-control-sm" placeholder="9080"></div>
						</div>
						<div class="row mb-2">
							<div class="col-3"></div>
							<div class="col-9 d-flex gap-3">
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="checkbox" id="remoteSecured">
									<label class="form-check-label" id="remoteSecuredLabel"></label>
								</div>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="checkbox" id="remoteAcceptCert">
									<label class="form-check-label" id="remoteAcceptCertLabel"></label>
								</div>
							</div>
						</div>
						<div class="row mb-2">
							<label class="col-3 col-form-label col-form-label-sm" id="remoteModalUserLabel"></label>
							<div class="col-9"><input type="text" id="remoteUsername" class="form-control form-control-sm"></div>
						</div>
						<div class="row mb-2">
							<label class="col-3 col-form-label col-form-label-sm" id="remoteModalPwdLabel"></label>
							<div class="col-9"><input type="password" id="remotePassword" class="form-control form-control-sm"></div>
						</div>
					</div>
					<!-- Link tab -->
					<div id="remoteTabLink" style="display:none;">
						<div class="row mb-2">
							<label class="col-3 col-form-label col-form-label-sm" id="remoteModalLinkLabel"></label>
							<div class="col-9">
								<select id="remoteLinkSelect" class="form-select form-select-sm">
									<option value=""></option>
								</select>
							</div>
						</div>
						<div id="remoteLinkInfo" class="text-muted small" style="display:none; padding: 4px 0 0 4px;">
							<img src="/uiTools/img/silk/connect.png">&nbsp;<span id="remoteLinkInfoText"></span>
						</div>
					</div>
				</div>
				<div class="mse-modal-footer">
					<button type="button" class="btn btn-sm btn-secondary" id="remoteModalCancelBtn"></button>
					<button type="button" class="btn btn-sm btn-primary" id="remoteModalConnectBtn"></button>
				</div>
			</div>
		</div>

		<div id="notifier" class="npaUi" data-ref="notifier"></div>
		<div id="monitor" class="npaUi" data-ref="sessionMonitor"></div>
		<script src="/js/jquery-3.6.3.min.js"></script>
		<script src="/js/bootstrap.bundle.min.js"></script>
		<script src="/uiTools/js/npaUiCore.js"></script>
		<script src="/resources/js/utils/apafUtils.js"></script>
		<script src="/apaf-micro-service-explorer/js/microServiceExplorer.js"></script>
	</body>
</html>
