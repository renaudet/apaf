<!doctype html>
<html>
	<head>
		<meta name="description" content="All-Purpose-Application-Framework Manage Workflow Page">
		<meta name="Author" lang="fr" content="Nicolas Renaudet">
		<meta name="Copyright" content="2024 Nicolas Renaudet - All rights reserved">
		<meta charset="ISO-8859-1">
		<meta http-equiv="Content-Type" content="text/html; ISO-8859-1">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Content-Style-Type" content="text/css">
		<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	    <meta name='viewport' content='width=device-width, initial-scale=1'>
		<link rel="icon" type="image/png" href="/apaf-branding/img/apaf-logo.png?version=1.0"/>
		<link href="/css/bootstrap.min.css" rel="stylesheet">
		<link href="/resources/css/apaf.css" rel="stylesheet">
		<title>All Purpose Application Framework</title>
	</head>
	<body>
		<div id="dataManager" class="npaUi" data-ref="workflowDataManager"></div>
		<div id="navBar" class="npaUi" data-ref="menu"></div>
		<div id="card" class="npaUi" data-config="/apaf-workflow-ui/json/manageWorkflowsCardConfig.json">
			<div>
				<div id="tabPanePlaceholder" class="npaUi" data-config="/apaf-workflow-ui/json/workflowsTabPaneConfig.json">
					<div data-tab-target="workflowsTab">
						<div id="toolbar" class="npaUi" data-config="/apaf-workflow-ui/json/workflowsToolbarConfig.json"></div>
						<div id="datatable" class="npaUi" data-config="/apaf-workflow-ui/json/workflowsTableConfig.json"></div>
					</div>
					<div data-tab-target="executionsTab">
						<div id="executionsToolbarDiv" class="npaUi" data-config="/apaf-workflow-ui/json/executionsToolbarConfig.json"></div>
						<div id="executionsTableDiv" class="npaUi" data-config="/apaf-workflow-ui/json/executionsTableConfig.json"></div>
					</div>
				</div>
			</div>
		</div>
		<div id="modalPlaceholder" class="npaUi" data-ref="dialog">
			<div id="form" class="npaUi" data-config="/apaf-workflow-ui/json/workflowEditForm.json"></div>
		</div>
		<div id="runDialogPlaceholder" class="npaUi" data-config="/apaf-workflow-ui/json/runDialogConfig.json">
			<div>
				<div class="mb-2">
					<strong><var>apaf.workflow.run.doc.label</var></strong>
					<div id="runDocContent" class="border rounded p-2 bg-light" style="max-height: 180px;overflow: auto;white-space: pre-wrap;"></div>
				</div>
				<div class="mb-1">
					<strong><var>apaf.workflow.run.context.label</var></strong>
				</div>
				<div id="runContextEditorDiv" class="npaUi" data-config="/apaf-workflow-ui/json/runContextEditorConfig.json"></div>
			</div>
		</div>
		<div id="resultDialogPlaceholder" class="npaUi" data-config="/apaf-workflow-ui/json/executionResultDialogConfig.json">
			<div>
				<div id="executionSummary" class="mb-2"></div>
				<div class="btn-group btn-group-sm mb-2" role="group">
					<button type="button" class="btn btn-outline-secondary execution-view-btn active" data-view="result"><var>apaf.workflow.executions.view.result</var></button>
					<button type="button" class="btn btn-outline-secondary execution-view-btn" data-view="console"><var>apaf.workflow.executions.view.console</var></button>
					<button type="button" class="btn btn-outline-secondary execution-view-btn" data-view="input"><var>apaf.workflow.executions.view.input</var></button>
				</div>
				<div id="executionResultEditorDiv" class="npaUi" data-config="/apaf-workflow-ui/json/executionResultEditorConfig.json"></div>
			</div>
		</div>
		<div id="notifier" class="npaUi" data-ref="notifier"></div>
		<script src="/js/jquery-3.6.3.min.js"></script>
		<script src="/js/bootstrap.bundle.min.js"></script>
		<script src="/uiTools/js/npaUiCore.js"></script>
		<script src="/resources/js/utils/apafUtils.js"></script>
		<script src="/apaf-workflow-ui/js/manageWorkflows.js"></script>
	</body>
</html>
